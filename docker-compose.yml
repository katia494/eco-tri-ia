services:
  api:
    build: .
    container_name: eco_tri_api
    environment:
      DATABASE_URL: sqlite:////app/data/eco_tri.db
      MODEL_PATH: backend/models/best.pt
    ports:
      - "8000:8000"
    volumes:
      - eco_tri_data:/app/data
    restart: unless-stopped

volumes:
  eco_tri_data:
